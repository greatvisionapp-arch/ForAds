<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Next Level</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
    }

    .header{
      width:100%;
      height:70px;
      background:#111827;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      border-bottom:1px solid rgba(255,255,255,0.08);
      position:sticky;
      top:0;
      z-index:100;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo img{
      width:45px;
      height:45px;
      border-radius:12px;
    }

    .logo h1{
      font-size:22px;
      font-weight:700;
      color:#38bdf8;
    }

    .nav-btn{
      background:#2563eb;
      color:white;
      border:none;
      padding:10px 18px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
    }

    .hero{
      width:100%;
      padding:60px 20px;
      text-align:center;
      background:linear-gradient(to bottom,#111827,#0f172a);
    }

    .hero img{
      width:120px;
      height:120px;
      border-radius:28px;
      box-shadow:0 0 25px rgba(56,189,248,0.4);
    }

    .hero h2{
      margin-top:20px;
      font-size:40px;
      font-weight:800;
    }

    .hero p{
      margin-top:15px;
      color:#cbd5e1;
      font-size:18px;
      max-width:700px;
      margin-left:auto;
      margin-right:auto;
      line-height:1.7;
    }

    .download-btn{
      display:inline-block;
      margin-top:30px;
      background:#38bdf8;
      color:black;
      text-decoration:none;
      padding:18px 40px;
      border-radius:14px;
      font-size:20px;
      font-weight:700;
      transition:0.3s;
    }

    .download-btn:hover{
      transform:scale(1.05);
      background:#0ea5e9;
    }

    .stats{
      width:100%;
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
      margin-top:50px;
    }

    .card{
      width:220px;
      background:#1e293b;
      padding:25px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,0.08);
    }

    .card h3{
      font-size:30px;
      color:#38bdf8;
    }

    .card p{
      margin-top:10px;
      color:#cbd5e1;
    }

    .screenshots{
      padding:60px 20px;
      text-align:center;
    }

    .screenshots h2{
      font-size:36px;
      margin-bottom:40px;
    }

    .shot-grid{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
    }

    .shot-grid img{
      width:260px;
      border-radius:20px;
      border:2px solid rgba(255,255,255,0.08);
      transition:0.3s;
    }

    .shot-grid img:hover{
      transform:translateY(-6px);
    }

    .footer{
      margin-top:60px;
      background:#111827;
      padding:30px;
      text-align:center;
      color:#94a3b8;
      border-top:1px solid rgba(255,255,255,0.08);
    }

    @media(max-width:768px){

      .hero h2{
        font-size:30px;
      }

      .hero p{
        font-size:16px;
      }

      .download-btn{
        width:100%;
      }

      .card{
        width:100%;
        max-width:300px;
      }

    }

  </style>

</head>

<body>

  <div class="header">

    <div class="logo">
      <img src="https://via.placeholder.com/150" alt="">
      <h1>Next Level</h1>
    </div>

    <button class="nav-btn">
      Android App
    </button>

  </div>

  <section class="hero">

    <img src="https://i.ibb.co/3Y7CfCRn/log2.png" alt="">

    <h2>Next Level Android Application</h2>

    <p>
      Fast, secure and optimized Android experience with modern UI,
      smooth performance and premium level functionality.
    </p>

    <a class="download-btn"
       href="https://firebasestorage.googleapis.com/v0/b/nextlevelcheats-94b66.firebasestorage.app/o/Vexx%20Loader%20v11%20(1)_sign.apk?alt=media&token=435efd77-7679-491c-bb80-3c07440a78a1">

       Download APK

    </a>

    <div class="stats">

      <div class="card">
        <h3>50K+</h3>
        <p>Downloads</p>
      </div>

      <div class="card">
        <h3>4.9★</h3>
        <p>User Rating</p>
      </div>

      <div class="card">
        <h3>v11</h3>
        <p>Latest Version</p>
      </div>

    </div>

  </section>

  <section class="screenshots">

    <h2>Application Preview</h2>

    <div class="shot-grid">

      <img src="https://via.placeholder.com/300x600">
      <img src="https://via.placeholder.com/300x600">
      <img src="https://via.placeholder.com/300x600">

    </div>

  </section>

  <div class="footer">

    © 2026 Next Level. All rights reserved.

  </div>

</body>
</html>
